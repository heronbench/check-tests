[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "check-tests"
version = "0.1.0"
description = "Keep a test suite honest: tests come first, are never bypassed, and are fast."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Heron Bench" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
check-tests = "check_tests:main"

[project.urls]
Homepage = "https://github.com/heronbench/check-tests"

[tool.setuptools]
py-modules = ["check_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
